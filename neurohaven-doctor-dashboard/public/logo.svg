<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Definitions for Gradients -->
  <defs>
    <linearGradient id="jadeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B9669" />
      <stop offset="100%" stop-color="#404E3B" />
    </linearGradient>
    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C8480" />
      <stop offset="100%" stop-color="#404E3B" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BAC8B1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F4F7F2" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow Background -->
  <circle cx="100" cy="100" r="80" fill="url(#glowGradient)" />

  <!-- Outer Brain & Haven Shield Structure -->
  <path d="M100 25 C145 25 175 60 175 105 C175 140 145 175 100 175 C55 175 25 140 25 105 C25 60 55 25 100 25 Z" 
        fill="none" 
        stroke="url(#jadeGradient)" 
        stroke-width="3" 
        stroke-dasharray="4 4" 
        opacity="0.5" />

  <!-- Left Brain Hemisphere Paths -->
  <path d="M100 45 C75 45 60 65 60 90 C60 105 70 115 65 125 C60 135 65 145 75 145 C85 145 90 135 95 135 C100 135 100 140 100 145" 
        fill="none" 
        stroke="url(#jadeGradient)" 
        stroke-width="5" 
        stroke-linecap="round" />
  
  <path d="M75 90 C70 90 68 82 72 78 C76 74 85 80 85 90" 
        fill="none" 
        stroke="url(#tealGradient)" 
        stroke-width="4" 
        stroke-linecap="round" />

  <!-- Right Brain Hemisphere Paths -->
  <path d="M100 45 C125 45 140 65 140 90 C140 105 130 115 135 125 C140 135 135 145 125 145 C115 145 110 135 105 135 C100 135 100 140 100 145" 
        fill="none" 
        stroke="url(#jadeGradient)" 
        stroke-width="5" 
        stroke-linecap="round" />

  <path d="M125 90 C130 90 132 82 128 78 C124 74 115 80 115 90" 
        fill="none" 
        stroke="url(#tealGradient)" 
        stroke-width="4" 
        stroke-linecap="round" />

  <!-- Central Connection / Neural Grid Nodes (The Graphify Inspiration) -->
  <!-- Left Side Nodes -->
  <circle cx="70" cy="70" r="5" fill="#7B9669" />
  <circle cx="65" cy="100" r="4" fill="#6C8480" />
  <circle cx="80" cy="120" r="5" fill="#404E3B" />
  
  <!-- Right Side Nodes -->
  <circle cx="130" cy="70" r="5" fill="#7B9669" />
  <circle cx="135" cy="100" r="4" fill="#6C8480" />
  <circle cx="120" cy="120" r="5" fill="#404E3B" />

  <!-- Center Axis Node -->
  <circle cx="100" cy="85" r="6" fill="#7B9669" />
  <circle cx="100" cy="115" r="5" fill="#404E3B" />

  <!-- Node Connection Vectors -->
  <line x1="100" y1="85" x2="70" y2="70" stroke="#BAC8B1" stroke-width="2" />
  <line x1="100" y1="85" x2="130" y2="70" stroke="#BAC8B1" stroke-width="2" />
  <line x1="70" y1="70" x2="65" y2="100" stroke="#BAC8B1" stroke-width="1.5" />
  <line x1="130" y1="70" x2="135" y2="100" stroke="#BAC8B1" stroke-width="1.5" />
  <line x1="65" y1="100" x2="80" y2="120" stroke="#BAC8B1" stroke-width="1.5" />
  <line x1="135" y1="100" x2="120" y2="120" stroke="#BAC8B1" stroke-width="1.5" />
  <line x1="80" y1="120" x2="100" y2="115" stroke="#BAC8B1" stroke-width="2" />
  <line x1="120" y1="120" x2="100" y2="115" stroke="#BAC8B1" stroke-width="2" />
  <line x1="100" y1="85" x2="100" y2="115" stroke="#7B9669" stroke-width="2.5" />
</svg>
